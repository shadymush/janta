<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Find Jobs - JANTA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/alwaysstrapped.css" rel="stylesheet">
    
    <!-- Dribbble UI Stylesheet -->
    <link href="css/dribbble.css" rel="stylesheet">
</head>


<body>
    <!-- Dashboard Header -->
    <header class="dashboard-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <a href="index.html" class="navbar-brand text-decoration-none me-5">
                <h1 class="m-0">JANTA</h1>
            </a>
            <nav class="d-none d-lg-flex gap-2">
                <a href="index.html" class="nav-link text-decoration-none active">Find Work</a>
                <a href="freelance-gigs.html" class="nav-link text-decoration-none">Freelance Gigs</a>
                <a href="career-guide.html" class="nav-link text-decoration-none">Career Guide</a>
                <a href="hire-talent.html" class="nav-link text-decoration-none">Hire Talent</a>
            </nav>
        </div>
        <div class="header-actions d-flex gap-3 align-items-center">
            <a href="#" class="text-white text-decoration-none"><i class="fa fa-bell"></i></a>
            <div class="dropdown">
                <div class="profile-avatar rounded-circle d-flex align-items-center justify-content-center"
                     id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false"
                     style="width: 40px; height: 40px; cursor: pointer; color: white; font-weight: bold; border: 2px solid rgba(255,255,255,0.2); transition: all 0.2s;">
                    <i class="fa fa-user"></i>
                </div>
                <ul class="dropdown-menu dropdown-menu-end shadow-lg profile-dropdown-menu" aria-labelledby="profileDropdown" style="background-color: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-md); padding: 8px; margin-top: 10px;">
                    <li><a class="dropdown-item py-2 px-3 text-white rounded hover-bg-dark-accent" href="#" style="font-weight: 600; font-size: 14px; transition: background-color 0.2s;"><i class="fa fa-user me-2"></i>My Profile</a></li>
                    <li><a class="dropdown-item py-2 px-3 text-white rounded hover-bg-dark-accent" href="index.html" style="font-weight: 600; font-size: 14px; transition: background-color 0.2s;"><i class="fa fa-sign-out-alt me-2"></i>Sign Out</a></li>
                </ul>
            </div>
        </div>
    </header>

    <!-- Filter Bar -->
    <div class="filter-bar d-flex gap-3 flex-wrap">
        <div class="position-relative flex-grow-1" style="max-width: 400px;">
            <i class="fa fa-search position-absolute text-white-50" style="left: 16px; top: 16px;"></i>
            <input type="text" class="form-control filter-input w-100 ps-5" placeholder="Search for jobs, skills, companies...">
        </div>
        <div class="position-relative">
            <i class="fa fa-map-marker-alt position-absolute text-white-50" style="left: 16px; top: 16px;"></i>
            <input type="text" class="form-control filter-input ps-5" placeholder="Nairobi, Kenya">
        </div>
        <button class="btn btn-dark-accent px-4 py-2" style="border-radius: var(--radius-md);"><i class="fa fa-sliders-h me-2"></i>Filters</button>
    </div>

    <!-- Main Content -->
    <div class="dashboard-wrapper">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-filters bg-white p-4" style="border-radius: var(--radius-lg);">
                <div class="filter-group">
                    <h5>Working Schedule</h5>
                    <label class="filter-checkbox"><input type="checkbox" checked> Full Time (342)</label>
                    <label class="filter-checkbox"><input type="checkbox"> Part Time (124)</label>
                    <label class="filter-checkbox"><input type="checkbox"> Freelance (89)</label>
                    <label class="filter-checkbox"><input type="checkbox"> Internship (45)</label>
                </div>
                
                <div class="filter-group">
                    <h5>Employment Type</h5>
                    <label class="filter-checkbox"><input type="checkbox" checked> Remote (234)</label>
                    <label class="filter-checkbox"><input type="checkbox" checked> On-site (156)</label>
                    <label class="filter-checkbox"><input type="checkbox"> Hybrid (98)</label>
                </div>

                <div class="promo-card mt-4">
                    <h4 class="text-dark">Upgrade your Profile</h4>
                    <p class="text-dark mb-4" style="opacity: 0.8; font-size: 14px;">Stand out to top employers in Kenya.</p>
                    <button class="btn btn-dark w-100 py-2" style="border-radius: var(--radius-pill); font-weight: 600;">Upgrade Now</button>
                </div>
            </div>
        </aside>
        <main>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Featured Jobs</h3>
                <span class="text-muted fw-bold">1,245 Jobs</span>
            </div>
            <div class="job-grid" id="jobGrid"></div>
        </main> aria-label="Page navigation" class="mt-5">
                <ul class="pagination justify-content-center">
                    <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item"><a class="page-link" href="#">Next</a></li>
                </ul>
            </nav>
        </main>
    </div>

    <!-- JavaScript Libraries -->
    <!-- Dynamic Avatar Init -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gradients = ['linear-gradient(135deg,#FF6B6B,#FF8E53)','linear-gradient(135deg,#4E54C8,#8F94FB)','linear-gradient(135deg,#11998e,#38ef7d)','linear-gradient(135deg,#fc00ff,#00dbde)','linear-gradient(135deg,#ec008c,#fc6767)','linear-gradient(135deg,#f12711,#f5af19)','linear-gradient(135deg,#8A2387,#E94057,#F27121)','linear-gradient(135deg,#00B4DB,#0083B0)'];
            const icons = ['<i class="fa fa-user"></i>','<i class="fa fa-user-astronaut"></i>','<i class="fa fa-user-ninja"></i>','<i class="fa fa-user-tie"></i>','<i class="fa fa-user-circle"></i>','<i class="fa fa-user-secret"></i>','<i class="fa fa-user-shield"></i>'];
            let grad = sessionStorage.getItem('janta_profile_grad');
            let icon = sessionStorage.getItem('janta_profile_icon');
            if (!grad || !icon) {
                grad = gradients[Math.floor(Math.random() * gradients.length)];
                icon = icons[Math.floor(Math.random() * icons.length)];
                sessionStorage.setItem('janta_profile_grad', grad);
                sessionStorage.setItem('janta_profile_icon', icon);
            }
            const av = document.getElementById('profileDropdown');
            if (av) { av.style.background = grad; av.innerHTML = icon; }
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/jobs.js"></script>
</body>
</html>
