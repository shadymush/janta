<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Contact Us - JANTA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/alwaysstrapped.css" rel="stylesheet">
    
    <!-- Dribbble UI Stylesheet -->
    <link href="css/dribbble.css" rel="stylesheet">
</head>


<body>
    <!-- Dashboard Header -->
    <header class="dashboard-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <a href="index.html" class="navbar-brand text-decoration-none me-5">
                <h1 class="m-0">JANTA</h1>
            </a>
            <nav class="d-none d-lg-flex gap-2">
                <a href="index.html" class="nav-link text-decoration-none active">Find Work</a>
                <a href="freelance-gigs.html" class="nav-link text-decoration-none">Freelance Gigs</a>
                <a href="career-guide.html" class="nav-link text-decoration-none">Career Guide</a>
                <a href="hire-talent.html" class="nav-link text-decoration-none">Hire Talent</a>
            </nav>
        </div>
        <div class="header-actions d-flex gap-3 align-items-center">
            <a href="#" class="text-white text-decoration-none"><i class="fa fa-bell"></i></a>
            <img src="img/testimonial-1.jpg" alt="Profile" class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover; border: 2px solid rgba(255,255,255,0.2);">
        </div>
    </header>

    <!-- Filter Bar -->
    <div class="filter-bar d-flex gap-3 flex-wrap">
        <div class="position-relative flex-grow-1" style="max-width: 400px;">
            <i class="fa fa-search position-absolute text-white-50" style="left: 16px; top: 16px;"></i>
            <input type="text" class="form-control filter-input w-100 ps-5" placeholder="Search for jobs, skills, companies...">
        </div>
        <div class="position-relative">
            <i class="fa fa-map-marker-alt position-absolute text-white-50" style="left: 16px; top: 16px;"></i>
            <input type="text" class="form-control filter-input ps-5" placeholder="Nairobi, Kenya">
        </div>
        <button class="btn btn-dark-accent px-4 py-2" style="border-radius: var(--radius-md);"><i class="fa fa-sliders-h me-2"></i>Filters</button>
    </div>

    <!-- Main Content -->
    <div class="dashboard-wrapper" style="grid-template-columns: 1fr; max-width: 1200px;">

        <main>

            <div class="bg-white p-5" style="border-radius: var(--radius-lg); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
                <div class="row g-5">
                    <div class="col-lg-5">
                        <h2 class="fw-bold mb-4">Get in Touch</h2>
                        <p class="text-muted mb-5" style="line-height:1.8;">Have a question or want to work with us? Reach out to the JANTA team and we'll get back to you within 24 hours.</p>
                        <div class="d-flex align-items-center mb-4">
                            <div class="bg-pastel-peach d-flex align-items-center justify-content-center me-4 flex-shrink-0" style="width:52px;height:52px;border-radius:var(--radius-md);">
                                <i class="fa fa-map-marker-alt text-dark"></i>
                            </div>
                            <div>
                                <div class="fw-bold">Our Office</div>
                                <div class="text-muted">Nairobi, Kenya</div>
                            </div>
                        </div>
                        <div class="d-flex align-items-center mb-4">
                            <div class="bg-pastel-mint d-flex align-items-center justify-content-center me-4 flex-shrink-0" style="width:52px;height:52px;border-radius:var(--radius-md);">
                                <i class="fa fa-phone text-dark"></i>
                            </div>
                            <div>
                                <div class="fw-bold">Phone</div>
                                <div class="text-muted">+254 712 345 678</div>
                            </div>
                        </div>
                        <div class="d-flex align-items-center">
                            <div class="bg-pastel-blue d-flex align-items-center justify-content-center me-4 flex-shrink-0" style="width:52px;height:52px;border-radius:var(--radius-md);">
                                <i class="fa fa-envelope text-dark"></i>
                            </div>
                            <div>
                                <div class="fw-bold">Email</div>
                                <div class="text-muted">helpdesk@janta.co.ke</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-7">
                        <form>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control bg-light border-0" id="contactName" placeholder="Name" style="border-radius:var(--radius-md);">
                                        <label for="contactName">Full Name</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="email" class="form-control bg-light border-0" id="contactEmail" placeholder="Email" style="border-radius:var(--radius-md);">
                                        <label for="contactEmail">Email Address</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="text" class="form-control bg-light border-0" id="contactSubject" placeholder="Subject" style="border-radius:var(--radius-md);">
                                        <label for="contactSubject">Subject</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <textarea class="form-control bg-light border-0" id="contactMessage" placeholder="Message" style="height:140px;border-radius:var(--radius-md);"></textarea>
                                        <label for="contactMessage">Message</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <button class="btn btn-dark w-100 py-3 fw-bold" style="border-radius:var(--radius-pill);">Send Message</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
